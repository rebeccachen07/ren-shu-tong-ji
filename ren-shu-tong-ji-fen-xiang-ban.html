<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Empty inline icon: stops the browser fetching /favicon.ico, which
         lives outside the artifact's routes and 404s. -->
    <link rel="icon" href="data:," />
    <title>人數統計分享版</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf7;
        --surface: #ffffff;
        --text: #1c1917;
        --dim: #6b7280;
        --border: #e7e5e0;
        --accent: #0f766e;
        --accent-ink: #ffffff;
        --danger: #dc2626;
        --warn: #b45309;
        --warn-solid: #d97706;
        --radius: 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f0f;
          --surface: #1a1a1a;
          --text: #f0f0f0;
          --dim: #9ca3af;
          --border: #2d2d2d;
          --accent: #2dd4bf;
          --accent-ink: #06281f;
          --danger: #f87171;
          --warn: #fbbf24;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          "PingFang SC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: default; }
      .tnum { font-variant-numeric: tabular-nums; }

      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 0 1rem calc(2.5rem + env(safe-area-inset-bottom));
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }

      /* ---- total header ---- */
      .total-head { text-align: center; padding: 1.5rem 0 1rem; }
      .total-head .label { font-size: 0.875rem; font-weight: 500; color: var(--dim); margin: 0; }
      .total-head .total { font-size: 3.75rem; line-height: 1.1; font-weight: 700; margin: 0.25rem 0 0; }
      .total-head .sub { font-size: 0.875rem; color: var(--dim); margin: 0.25rem 0 0; }

      /* ---- generic buttons ---- */
      .btn {
        min-height: 2.75rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: transparent;
        padding: 0 1rem;
        font-weight: 500;
      }
      .btn-accent {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: transparent;
        font-weight: 600;
      }
      .btn-accent:disabled { opacity: 0.5; }
      .btn-warn-solid { background: var(--warn-solid); color: #fff; border-color: transparent; font-weight: 600; }
      .btn-danger-solid { background: #dc2626; color: #fff; border-color: transparent; font-weight: 600; }
      .btn-warn-text { color: var(--warn); }
      .btn-danger-text { color: var(--danger); }
      .btn-sm { min-height: 2.5rem; font-size: 0.875rem; padding: 0 0.75rem; }
      .btn:disabled { opacity: 0.4; }

      .field-label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
      .input {
        min-height: 3rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 0 0.75rem;
        font-size: 1rem;
        width: 100%;
        min-width: 0;
      }
      .input:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .error { margin: 0.5rem 0 0; font-size: 0.875rem; color: var(--danger); }
      .hint { font-size: 0.875rem; color: var(--dim); }

      section.panel { padding: 0.75rem; margin-bottom: 1.25rem; }
      .row { display: flex; gap: 0.5rem; }
      .row > .grow { flex: 1 1 auto; min-width: 0; }
      .row > .shrink { flex: 0 0 auto; }

      /* ---- counter cards ---- */
      ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
      .counter-top { display: flex; align-items: stretch; gap: 0.5rem; padding: 0.75rem; }
      .big-tap {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 6rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        border: none;
        border-radius: calc(var(--radius) - 4px);
        background: var(--accent);
        color: var(--accent-ink);
        padding: 0.75rem 1rem;
        text-align: left;
      }
      .big-tap:active { transform: scale(0.98); }
      .big-tap .name { display: block; font-size: 1.125rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .big-tap .tap-hint { display: block; font-size: 0.875rem; opacity: 0.8; margin-top: 0.125rem; }
      .big-tap .count { font-size: 3rem; font-weight: 700; flex: 0 0 auto; }
      .side-btns { display: flex; flex-direction: column; gap: 0.5rem; width: 3.5rem; flex: 0 0 auto; }
      .side-btns .minus {
        flex: 1 1 auto;
        border-radius: calc(var(--radius) - 4px);
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 1.5rem;
        font-weight: 700;
      }
      .side-btns .minus:disabled { opacity: 0.35; }
      .side-btns .edit-btn {
        min-height: 2.5rem;
        border-radius: calc(var(--radius) - 4px);
        border: 1px solid var(--border);
        background: var(--bg);
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--dim);
      }
      .edit-panel { border-top: 1px solid var(--border); padding: 0.75rem; }
      .edit-panel .block + .block { margin-top: 1rem; }
      .edit-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }

      /* ---- records ---- */
      .records h2 { font-size: 1.125rem; font-weight: 600; margin: 2rem 0 0.75rem; }
      .record { padding: 1rem; }
      .record-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
      .record-head .date { font-weight: 600; margin: 0; }
      .record-head .rtotal { font-size: 0.875rem; color: var(--dim); margin: 0; white-space: nowrap; }
      .record-head .rtotal b { font-size: 1.25rem; color: var(--text); }
      .record-items { list-style: none; margin: 0.5rem 0 0; padding: 0; }
      .record-items li {
        display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
        padding: 0.375rem 0;
      }
      .record-items li + li { border-top: 1px solid var(--border); }
      .record-items .rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .record-items .rcount { font-weight: 600; flex: 0 0 auto; }
      .record-foot { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
      .record-foot .confirm-group { display: flex; gap: 0.5rem; }

      .empty {
        padding: 2.5rem 1rem;
        text-align: center;
      }
      .empty .t { font-size: 1.125rem; font-weight: 500; margin: 0; }
      .empty .d { font-size: 0.875rem; color: var(--dim); margin: 0.5rem 0 0; line-height: 1.6; }

      .saved-note { margin: 0.5rem 0 0; font-size: 0.875rem; font-weight: 500; color: var(--accent); }
      .storage-note { margin: 2rem 0 0; text-align: center; font-size: 0.8125rem; color: var(--dim); line-height: 1.6; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <!-- Total header -->
      <section class="total-head">
        <p class="label">總人數</p>
        <p class="total tnum" id="total-count">0</p>
        <p class="sub" id="item-count-label">共 0 個項目</p>
        <div id="reset-all-zone"></div>
      </section>

      <!-- Counting date + keep this round as a record -->
      <section class="card panel" aria-label="統計日期與保留紀錄">
        <label class="field-label" for="count-date">統計日期</label>
        <input class="input" type="date" id="count-date" />
        <p class="hint" id="count-date-label" style="margin: 0.5rem 0 0"></p>
        <div id="save-zone"></div>
        <p class="error" id="save-error" hidden></p>
        <p class="saved-note" id="saved-note" hidden>已保留成紀錄，目前數字已歸零。</p>
      </section>

      <!-- Add a new counter -->
      <form class="card panel" id="add-form">
        <label class="field-label" for="new-counter-name">新增項目</label>
        <div class="row">
          <input
            class="input grow"
            id="new-counter-name"
            type="text"
            placeholder="例如：主日聚會、青少年、兒童…"
            autocomplete="off"
          />
          <button class="btn btn-accent shrink" type="submit" style="min-height: 3rem; padding: 0 1.25rem">＋ 新增</button>
        </div>
        <p class="error" id="add-error" hidden></p>
      </form>

      <!-- Counter list -->
      <div id="counter-zone"></div>

      <!-- Saved records history -->
      <section class="records" id="records-section" hidden>
        <h2>已保留的紀錄</h2>
        <ul class="plain" id="record-list"></ul>
      </section>

      <p class="storage-note" id="storage-note">
        數字和紀錄都存在這支手機的瀏覽器裡，只有你自己看得到；<br />
        換手機、或清除瀏覽資料後，數字會不見。
      </p>
    </main>

    <script>
      (function () {
        "use strict";

        var STORAGE_KEY = "ren-shu-tong-ji-share-v1";

        /* ---------- storage: everything lives in this browser, on this device ---------- */
        var storageOK = true;
        function loadState() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return { counters: [], records: [] };
            var parsed = JSON.parse(raw);
            if (!parsed || !Array.isArray(parsed.counters) || !Array.isArray(parsed.records)) {
              return { counters: [], records: [] };
            }
            return parsed;
          } catch (e) {
            storageOK = false;
            return { counters: [], records: [] };
          }
        }
        function saveState() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {
            storageOK = false;
            showStorageWarning();
          }
        }
        function showStorageWarning() {
          var note = document.getElementById("storage-note");
          note.textContent = "這支手機的瀏覽器無法儲存數字，關閉頁面後數字會不見。";
        }

        var state = loadState();
        if (!storageOK) showStorageWarning();

        /* Per-counter transient UI state (not persisted): which edit panels
           are open, and which confirm buttons are armed. */
        var ui = {}; // id -> { editing, confirmDelete, confirmReset }
        function uiFor(id) {
          if (!ui[id]) ui[id] = { editing: false, confirmDelete: false, confirmReset: false };
          return ui[id];
        }
        var confirmResetAll = false;
        var confirmSave = false;
        var recordConfirmDelete = {}; // record id -> true

        function newId() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
          }
          return "id-" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e9).toString(36);
        }

        /* ---------- dates ---------- */
        function todayLocal() {
          var d = new Date();
          var m = String(d.getMonth() + 1).padStart(2, "0");
          var day = String(d.getDate()).padStart(2, "0");
          return d.getFullYear() + "-" + m + "-" + day;
        }
        function formatDateLabel(iso) {
          var parts = String(iso || "").split("-").map(Number);
          var y = parts[0] || 1970, m = parts[1] || 1, d = parts[2] || 1;
          var date = new Date(y, m - 1, d);
          var weekday = new Intl.DateTimeFormat("zh-TW", { weekday: "short" }).format(date);
          return y + " 年 " + m + " 月 " + d + " 日（" + weekday + "）";
        }

        /* ---------- helpers ---------- */
        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }
        function total() {
          return state.counters.reduce(function (sum, c) { return sum + c.count; }, 0);
        }
        function findCounter(id) {
          for (var i = 0; i < state.counters.length; i++) {
            if (state.counters[i].id === id) return state.counters[i];
          }
          return null;
        }

        /* ---------- rendering ---------- */
        var totalCountEl = document.getElementById("total-count");
        var itemCountLabelEl = document.getElementById("item-count-label");
        var resetAllZone = document.getElementById("reset-all-zone");
        var counterZone = document.getElementById("counter-zone");
        var saveZone = document.getElementById("save-zone");
        var saveErrorEl = document.getElementById("save-error");
        var savedNoteEl = document.getElementById("saved-note");
        var dateInput = document.getElementById("count-date");
        var dateLabelEl = document.getElementById("count-date-label");
        var recordsSection = document.getElementById("records-section");
        var recordListEl = document.getElementById("record-list");

        function renderHeader() {
          totalCountEl.textContent = String(total());
          itemCountLabelEl.textContent = "共 " + state.counters.length + " 個項目";
          resetAllZone.innerHTML = "";
          if (state.counters.length === 0) return;
          if (confirmResetAll) {
            var wrap = el("div", "row");
            wrap.style.justifyContent = "center";
            wrap.style.marginTop = "0.75rem";
            var yes = el("button", "btn btn-warn-solid btn-sm", "確定全部歸零");
            yes.type = "button";
            yes.addEventListener("click", function () {
              state.counters.forEach(function (c) { c.count = 0; });
              confirmResetAll = false;
              saveState();
              renderAll();
            });
            var no = el("button", "btn btn-sm", "取消");
            no.type = "button";
            no.addEventListener("click", function () { confirmResetAll = false; renderHeader(); });
            wrap.appendChild(yes);
            wrap.appendChild(no);
            resetAllZone.appendChild(wrap);
          } else {
            var btn = el("button", "btn btn-warn-text btn-sm", "全部歸零");
            btn.type = "button";
            btn.style.marginTop = "0.75rem";
            btn.addEventListener("click", function () { confirmResetAll = true; renderHeader(); });
            resetAllZone.appendChild(btn);
          }
        }

        function renderSaveZone() {
          saveZone.innerHTML = "";
          if (state.counters.length === 0) return;
          if (confirmSave) {
            var box = el("div");
            box.style.marginTop = "0.75rem";
            var msg = el("p", null,
              "把 " + formatDateLabel(dateInput.value) + " 的數字保留成一筆紀錄（總人數 " +
              total() + "），目前的數字會歸零，開始下一次統計。");
            msg.style.margin = "0";
            msg.style.fontSize = "0.875rem";
            var row = el("div", "row");
            row.style.marginTop = "0.5rem";
            var yes = el("button", "btn btn-accent grow", "確定保留");
            yes.type = "button";
            yes.addEventListener("click", doSaveRecord);
            var no = el("button", "btn shrink", "取消");
            no.type = "button";
            no.addEventListener("click", function () { confirmSave = false; renderSaveZone(); });
            row.appendChild(yes);
            row.appendChild(no);
            box.appendChild(msg);
            box.appendChild(row);
            saveZone.appendChild(box);
          } else {
            var btn = el("button", "btn btn-accent", "保留紀錄");
            btn.type = "button";
            btn.style.width = "100%";
            btn.style.minHeight = "3rem";
            btn.style.marginTop = "0.75rem";
            btn.style.fontSize = "1rem";
            btn.addEventListener("click", function () {
              saveErrorEl.hidden = true;
              savedNoteEl.hidden = true;
              confirmSave = true;
              renderSaveZone();
            });
            saveZone.appendChild(btn);
          }
        }

        function doSaveRecord() {
          var date = dateInput.value;
          if (!date) {
            saveErrorEl.textContent = "請先選擇統計日期";
            saveErrorEl.hidden = false;
            confirmSave = false;
            renderSaveZone();
            return;
          }
          var items = state.counters.map(function (c) { return { name: c.name, count: c.count }; });
          var sum = items.reduce(function (s, it) { return s + it.count; }, 0);
          state.records.unshift({ id: newId(), date: date, items: items, total: sum });
          state.counters.forEach(function (c) { c.count = 0; });
          confirmSave = false;
          saveErrorEl.hidden = true;
          savedNoteEl.hidden = false;
          saveState();
          renderAll();
        }

        function renderCounters() {
          counterZone.innerHTML = "";
          if (state.counters.length === 0) {
            var empty = el("div", "card empty");
            empty.appendChild(el("p", "t", "還沒有任何項目"));
            var d = el("p", "d", "在上面輸入你想統計的名稱，按「＋ 新增」，就會出現一顆專屬的大按鈕，來一人點一下。");
            empty.appendChild(d);
            counterZone.appendChild(empty);
            return;
          }
          var list = el("ul", "plain");
          state.counters.forEach(function (counter) {
            list.appendChild(buildCounterCard(counter));
          });
          counterZone.appendChild(list);
        }

        function buildCounterCard(counter) {
          var u = uiFor(counter.id);
          var li = el("li", "card");

          var top = el("div", "counter-top");

          var big = el("button", "big-tap");
          big.type = "button";
          big.setAttribute("aria-label", counter.name + " 加一人");
          var nameWrap = el("span");
          nameWrap.style.minWidth = "0";
          nameWrap.appendChild(el("span", "name", counter.name));
          nameWrap.appendChild(el("span", "tap-hint", "點一下 +1 人"));
          var countSpan = el("span", "count tnum", String(counter.count));
          countSpan.dataset.role = "count";
          big.appendChild(nameWrap);
          big.appendChild(countSpan);
          big.addEventListener("click", function () {
            counter.count += 1;
            saveState();
            syncCounts();
          });
          top.appendChild(big);

          var side = el("div", "side-btns");
          var minus = el("button", "minus", "−");
          minus.type = "button";
          minus.setAttribute("aria-label", counter.name + " 減一人");
          minus.disabled = counter.count === 0;
          minus.dataset.role = "minus";
          minus.addEventListener("click", function () {
            if (counter.count > 0) counter.count -= 1;
            saveState();
            syncCounts();
          });
          var editBtn = el("button", "edit-btn", "編輯");
          editBtn.type = "button";
          editBtn.setAttribute("aria-label", "編輯 " + counter.name);
          editBtn.setAttribute("aria-expanded", u.editing ? "true" : "false");
          editBtn.addEventListener("click", function () {
            u.editing = !u.editing;
            u.confirmDelete = false;
            u.confirmReset = false;
            renderCounters();
          });
          side.appendChild(minus);
          side.appendChild(editBtn);
          top.appendChild(side);
          li.appendChild(top);

          if (u.editing) li.appendChild(buildEditPanel(counter, u));
          return li;
        }

        function buildEditPanel(counter, u) {
          var panel = el("div", "edit-panel");

          /* Direct typed count */
          var block1 = el("div", "block");
          var countForm = document.createElement("form");
          var countLabel = el("label", "field-label", "直接輸入人數");
          var countInputId = "count-input-" + counter.id;
          countLabel.htmlFor = countInputId;
          var countRow = el("div", "row");
          var countInput = document.createElement("input");
          countInput.className = "input grow tnum";
          countInput.id = countInputId;
          countInput.type = "number";
          countInput.inputMode = "numeric";
          countInput.value = String(counter.count);
          var countBtn = el("button", "btn btn-accent shrink", "設定人數");
          countBtn.type = "submit";
          countRow.appendChild(countInput);
          countRow.appendChild(countBtn);
          var countError = el("p", "error");
          countError.hidden = true;
          countForm.appendChild(countLabel);
          countForm.appendChild(countRow);
          countForm.appendChild(countError);
          countForm.addEventListener("submit", function (e) {
            e.preventDefault();
            var raw = countInput.value.trim();
            var value = Number(raw);
            if (raw === "" || !Number.isInteger(value) || value < 0) {
              countError.textContent = "請輸入 0 以上的整數";
              countError.hidden = false;
              return;
            }
            if (value > 999999) {
              countError.textContent = "數字太大了，請輸入 999999 以下";
              countError.hidden = false;
              return;
            }
            counter.count = value;
            countError.hidden = true;
            saveState();
            syncCounts();
          });
          block1.appendChild(countForm);
          panel.appendChild(block1);

          /* Batch add / subtract */
          var block2 = el("div", "block");
          var stepLabel = el("label", "field-label", "一次加減好幾人");
          var stepInputId = "step-input-" + counter.id;
          stepLabel.htmlFor = stepInputId;
          var stepRow = el("div", "row");
          var stepInput = document.createElement("input");
          stepInput.className = "input tnum";
          stepInput.id = stepInputId;
          stepInput.type = "number";
          stepInput.inputMode = "numeric";
          stepInput.min = "1";
          stepInput.value = "5";
          stepInput.style.width = "5rem";
          stepInput.style.flex = "0 0 auto";
          var addBtn = el("button", "btn btn-accent grow", "＋ 加這些人");
          addBtn.type = "button";
          var subBtn = el("button", "btn grow", "− 減這些人");
          subBtn.type = "button";
          var stepError = el("p", "error");
          stepError.hidden = true;
          function parseStep() {
            var raw = stepInput.value.trim();
            var value = Number(raw);
            if (raw === "" || !Number.isInteger(value) || value <= 0) {
              stepError.textContent = "請輸入要加減的人數（1 以上）";
              stepError.hidden = false;
              return null;
            }
            stepError.hidden = true;
            return value;
          }
          addBtn.addEventListener("click", function () {
            var step = parseStep();
            if (step === null) return;
            counter.count += step;
            saveState();
            syncCounts();
          });
          subBtn.addEventListener("click", function () {
            var step = parseStep();
            if (step === null) return;
            counter.count = Math.max(counter.count - step, 0);
            saveState();
            syncCounts();
          });
          stepRow.appendChild(stepInput);
          stepRow.appendChild(addBtn);
          stepRow.appendChild(subBtn);
          block2.appendChild(stepLabel);
          block2.appendChild(stepRow);
          block2.appendChild(stepError);
          panel.appendChild(block2);

          /* Rename */
          var block3 = el("div", "block");
          var nameForm = document.createElement("form");
          var nameRow = el("div", "row");
          var nameInput = document.createElement("input");
          nameInput.className = "input grow";
          nameInput.type = "text";
          nameInput.value = counter.name;
          nameInput.setAttribute("aria-label", "項目名稱");
          nameInput.autocomplete = "off";
          var nameBtn = el("button", "btn btn-accent shrink", "改名");
          nameBtn.type = "submit";
          var nameError = el("p", "error");
          nameError.hidden = true;
          nameRow.appendChild(nameInput);
          nameRow.appendChild(nameBtn);
          nameForm.appendChild(nameRow);
          nameForm.appendChild(nameError);
          nameForm.addEventListener("submit", function (e) {
            e.preventDefault();
            var name = nameInput.value.trim();
            if (!name) {
              nameError.textContent = "請先輸入名稱";
              nameError.hidden = false;
              return;
            }
            counter.name = name;
            u.editing = false;
            saveState();
            renderAll();
          });
          block3.appendChild(nameForm);
          panel.appendChild(block3);

          /* Reset / delete with inline confirm */
          var actions = el("div", "edit-actions");
          if (u.confirmReset) {
            var yesR = el("button", "btn btn-warn-solid btn-sm", "確定歸零");
            yesR.type = "button";
            yesR.addEventListener("click", function () {
              counter.count = 0;
              u.confirmReset = false;
              saveState();
              renderCounters();
              renderHeader();
              renderSaveZone();
            });
            var noR = el("button", "btn btn-sm", "取消");
            noR.type = "button";
            noR.addEventListener("click", function () { u.confirmReset = false; renderCounters(); });
            actions.appendChild(yesR);
            actions.appendChild(noR);
          } else {
            var resetBtn = el("button", "btn btn-warn-text btn-sm", "這個項目歸零");
            resetBtn.type = "button";
            resetBtn.addEventListener("click", function () { u.confirmReset = true; renderCounters(); });
            actions.appendChild(resetBtn);
          }
          if (u.confirmDelete) {
            var yesD = el("button", "btn btn-danger-solid btn-sm", "確定刪除");
            yesD.type = "button";
            yesD.addEventListener("click", function () {
              state.counters = state.counters.filter(function (c) { return c.id !== counter.id; });
              delete ui[counter.id];
              saveState();
              renderAll();
            });
            var noD = el("button", "btn btn-sm", "取消");
            noD.type = "button";
            noD.addEventListener("click", function () { u.confirmDelete = false; renderCounters(); });
            actions.appendChild(yesD);
            actions.appendChild(noD);
          } else {
            var delBtn = el("button", "btn btn-danger-text btn-sm", "刪除項目");
            delBtn.type = "button";
            delBtn.addEventListener("click", function () { u.confirmDelete = true; renderCounters(); });
            actions.appendChild(delBtn);
          }
          panel.appendChild(actions);
          return panel;
        }

        /* Update counts in place so an open edit panel (and what the user
           is typing in it) is never disturbed by a tap. */
        function syncCounts() {
          totalCountEl.textContent = String(total());
          var cards = counterZone.querySelectorAll("li.card");
          // Cards are rendered in state order; match by position.
          var spans = counterZone.querySelectorAll('[data-role="count"]');
          var minusBtns = counterZone.querySelectorAll('[data-role="minus"]');
          state.counters.forEach(function (c, i) {
            if (spans[i]) spans[i].textContent = String(c.count);
            if (minusBtns[i]) minusBtns[i].disabled = c.count === 0;
          });
          void cards;
          if (confirmSave) renderSaveZone(); // keep the confirm text's total fresh
        }

        function renderRecords() {
          recordListEl.innerHTML = "";
          recordsSection.hidden = state.records.length === 0;
          state.records.forEach(function (record) {
            var li = el("li", "card record");
            var head = el("div", "record-head");
            head.appendChild(el("p", "date", formatDateLabel(record.date)));
            var rt = el("p", "rtotal");
            rt.appendChild(document.createTextNode("總人數 "));
            var b = el("b", "tnum", String(record.total));
            rt.appendChild(b);
            head.appendChild(rt);
            li.appendChild(head);

            var items = el("ul", "record-items");
            record.items.forEach(function (item) {
              var row = el("li");
              row.appendChild(el("span", "rname", item.name));
              row.appendChild(el("span", "rcount tnum", String(item.count)));
              items.appendChild(row);
            });
            li.appendChild(items);

            var foot = el("div", "record-foot");
            if (recordConfirmDelete[record.id]) {
              var group = el("span", "confirm-group");
              var yes = el("button", "btn btn-danger-solid btn-sm", "確定刪除");
              yes.type = "button";
              yes.addEventListener("click", function () {
                state.records = state.records.filter(function (r) { return r.id !== record.id; });
                delete recordConfirmDelete[record.id];
                saveState();
                renderRecords();
              });
              var no = el("button", "btn btn-sm", "取消");
              no.type = "button";
              no.addEventListener("click", function () {
                delete recordConfirmDelete[record.id];
                renderRecords();
              });
              group.appendChild(yes);
              group.appendChild(no);
              foot.appendChild(group);
            } else {
              var del = el("button", "btn btn-danger-text btn-sm", "刪除這筆紀錄");
              del.type = "button";
              del.addEventListener("click", function () {
                recordConfirmDelete[record.id] = true;
                renderRecords();
              });
              foot.appendChild(del);
            }
            li.appendChild(foot);
            recordListEl.appendChild(li);
          });
        }

        function renderAll() {
          renderHeader();
          renderSaveZone();
          renderCounters();
          renderRecords();
        }

        /* ---------- add form ---------- */
        var addForm = document.getElementById("add-form");
        var addInput = document.getElementById("new-counter-name");
        var addError = document.getElementById("add-error");
        addForm.addEventListener("submit", function (e) {
          e.preventDefault();
          var name = addInput.value.trim();
          if (!name) {
            addError.textContent = "請先輸入項目名稱";
            addError.hidden = false;
            return;
          }
          addError.hidden = true;
          state.counters.push({ id: newId(), name: name, count: 0 });
          addInput.value = "";
          savedNoteEl.hidden = true;
          saveState();
          renderAll();
          addInput.focus();
        });

        /* ---------- date ---------- */
        dateInput.value = todayLocal();
        dateLabelEl.textContent = formatDateLabel(dateInput.value);
        dateInput.addEventListener("change", function () {
          dateLabelEl.textContent = formatDateLabel(dateInput.value);
          confirmSave = false;
          savedNoteEl.hidden = true;
          renderSaveZone();
        });

        renderAll();
      })();
    </script>
  </body>
</html>
